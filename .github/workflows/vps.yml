name: Windows 10 VPS (LocalTunnel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Node.js Doğrudan İndir ve Kur
      run: |
        Invoke-WebRequest -Uri "https://nodejs.org/dist/v18.16.0/node-v18.16.0-x64.msi" -OutFile "node.msi"
        Start-Process msiexec.exe -Wait -ArgumentList '/i node.msi /quiet /norestart'
        
    - name: RDP (Uzak Masaüstü) Servisini Aç
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        
    - name: Yönetici Şifresi Belirle
      run: |
        net user runneradmin GucluSifre123!

    - name: LocalTunnel Kur ve Port 3389'u Tünelle
      run: |
        # Node yüklendikten sonra PATH'in güncellenmesi için komut satırı yenilenir
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        npm install -g localtunnel
        lt --port 3389

    - name: Bağlantıyı Açık Tut
      run: |
        Start-Sleep -Seconds 21600
